<!--
  ============================================================================
  PLACEHOLDER — social share card, 1200x630.
  ============================================================================
  SVG is not reliably supported as an og:image by Slack, WhatsApp or X.
  TO REPLACE: export this as og.png at 1200x630 and update the `ogImage` path
  in src/layouts/Layout.astro.
  ============================================================================
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <rect width="1200" height="630" fill="#17181b"/>

  <g transform="translate(100 250)">
    <rect x="0" y="0" width="44" height="44" rx="12" fill="none" stroke="#eeece9" stroke-width="3"/>
    <rect x="7" y="7" width="17" height="17" rx="4" fill="#e8637a"/>
  </g>

  <text x="160" y="282" fill="#eeece9" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="30" font-weight="500" letter-spacing="-0.3">Framewise</text>

  <text x="100" y="380" fill="#eeece9" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="560" letter-spacing="-2.2">See every frame.</text>
  <text x="100" y="458" fill="#eeece9" font-family="Geist, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="72" font-weight="560" letter-spacing="-2.2">Control every moment.</text>

  <text x="100" y="530" fill="#8d8d8c" font-family="'Geist Mono', ui-monospace, monospace" font-size="22" letter-spacing="2.2">FOR CHROME &amp; EDGE</text>
</svg>
